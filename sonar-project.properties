# SonarCloud runs in automatic analysis mode and reads this file.
#
# Copy-paste detection is switched off for src/content, and only there. That
# directory holds the product prose - feature cards and FAQ answers - as an
# array of { q, a } entries. Every answer says something different, but they
# share a shape, so once there are ten of them Sonar's tokenizer sees the same
# run of punctuation twice and reports 47 % duplication on a file whose lines
# have no words in common.
#
# The rule is not being lowered: duplication detection is meant for logic, and
# `npm run dup` (jscpd, threshold 2 %) still covers every source file including
# this one. What changes is the scope of a tool, the same way vitest coverage
# excludes the runes stores next door.
sonar.cpd.exclusions=src/content/**
