name: ci

# The full quality gate on every push and PR to main. Merging to main deploys:
# Cloudflare Pages builds and publishes the site from main automatically.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: nothing this project needs at install time runs
        # through a lifecycle script. `prepare` only installs the local git
        # hooks, which a runner has no use for, and astro syncs its own types
        # from `check` and `build`. So a dependency cannot execute code here.
        run: npm ci --ignore-scripts

      - name: Format check (prettier)
        run: npm run format:check

      - name: Lint (eslint + sonarjs, zero warnings)
        run: npm run lint

      - name: Type-check (astro check)
        run: npm run check

      - name: Dead code (knip)
        run: npm run knip

      - name: Duplication (jscpd)
        run: npm run dup

      - name: Build
        run: npm run build

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Epingle sur le SHA de v2.3.9 : un tag mobile peut etre repointe vers un
      # autre commit par son auteur, et cette action lit tout le depot.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
