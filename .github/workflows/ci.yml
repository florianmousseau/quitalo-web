name: ci

# The full quality gate on every push and PR to main. Merging to main deploys:
# Cloudflare Pages builds and publishes the site from main automatically.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check (prettier)
        run: npm run format:check

      - name: Lint (eslint + sonarjs, zero warnings)
        run: npm run lint

      - name: Type-check (astro check)
        run: npm run check

      - name: Dead code (knip)
        run: npm run knip

      - name: Duplication (jscpd)
        run: npm run dup

      - name: Build
        run: npm run build

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
